<!DOCTYPE html>
   <html lang="en">
   <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Chat em Tempo Real</title>
   </head>
   <body>
       <ul id="messages"></ul>
       <form id="form" action="http://127.0.0.1:5000/chat" method="POST">
           <input id="input" autocomplete="off" /><button type="submit">Enviar</button>
       </form>

       <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.0.4/socket.io.js"></script>
       <script>
           var socket = io();
           socket.on("connect", ()=>{
            console.log("Applications connected");
           })

           socket.on('message', (msg)=>{show_message(msg)});

           document.getElementById('form').onsubmit = function() {
               console.log("teste")
                const client_message = document.getElementById('input').value
                show_message(`Client: ${client_message}`)
                socket.emit('message', client_message)
                document.getElementById('input').value = '';
                return false;
           };

           function show_message(msg){
                var ul = document.getElementById('messages');
                var li = document.createElement('li');
                li.appendChild(document.createTextNode(msg));
                ul.appendChild(li);
           }
       </script>
   </body>
</html>
